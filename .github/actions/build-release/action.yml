name: Build release executables
description: Build OpenReliant and its multiplayer transport for a release target
inputs:
  target:
    description: Zig target triple
    required: true
  smoke:
    description: Run the headless session on a runner that can execute the target
    default: "false"
runs:
  using: composite
  steps:
    - uses: mlugg/setup-zig@v2
      with:
        version: 0.17.1
    - name: Check the build tools
      shell: bash
      run: |
        if ! command -v ninja > /dev/null; then
          case "$RUNNER_OS" in
            macOS) brew install ninja ;;
            Linux) sudo apt-get update && sudo apt-get install -y ninja-build ;;
          esac
        fi
    - name: Build the transport and game
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        SMOKE: ${{ inputs.smoke }}
      run: |
        work="$RUNNER_TEMP/openreliant-transport"
        python=python3
        args=()
        if [ "$SMOKE" = true ]; then
          python3 -m venv "$RUNNER_TEMP/openreliant-session-tests"
          python="$RUNNER_TEMP/openreliant-session-tests/bin/python"
          "$python" -m pip install -r scripts/transport-test-requirements.txt
          args+=(--test-identities)
        fi
        "$python" scripts/build_transport.py "$work" "$TARGET" "${args[@]}"
        zig build --release=fast -Dstrip -Dtarget="$TARGET" -Dgns-prefix="$work/$TARGET/prefix"
    - name: Test the release executables headlessly
      if: inputs.smoke == 'true'
      shell: bash
      run: |
        work="$RUNNER_TEMP/openreliant-transport"
        python3 scripts/check-direct-session.py zig-out/bin/openreliant "$work/session-identities"

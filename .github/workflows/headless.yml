# Publish the current main branch as a multi-architecture headless image.
name: Headless image

on:
  push:
    branches: [main]

concurrency:
  group: headless-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, target: x86_64-linux-gnu.2.31 }
          - { arch: arm64, target: aarch64-linux-gnu.2.31 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: ./.github/actions/build-transport
        id: transport
        with:
          target: ${{ matrix.target }}
      - name: Build the headless executable
        env:
          TARGET: ${{ matrix.target }}
          GNS_PREFIX: ${{ steps.transport.outputs.prefix }}
        run: |
          zig build --release=fast -Dstrip -Dtarget="$TARGET" -Dgns-prefix="$GNS_PREFIX"
          mkdir -p "dist/${{ matrix.arch }}"
          cp zig-out/bin/openreliant LICENSE deps/luau/LICENSE.txt "dist/${{ matrix.arch }}/"
          cp zig-out/LICENSE-*.txt "dist/${{ matrix.arch }}/"
      - uses: actions/upload-artifact@v7
        with:
          name: headless-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}

  publish:
    needs: build
    if: github.repository == 'OpenReliant/openreliant'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: headless-*
          path: artifacts
      - name: Prepare the image
        run: |
          mkdir -p dist
          mv artifacts/headless-amd64 dist/amd64
          mv artifacts/headless-arm64 dist/arm64
      - name: Publish the multi-architecture image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use --driver docker-container
          docker buildx build --platform linux/amd64,linux/arm64 --push -f Dockerfile.headless \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag ghcr.io/openreliant/openreliant-headless:latest .

# Publishes the website, website/, on GitHub Pages: what OpenReliant is, the latest release's
# downloads, the roadmap and the mods, and the documentation under docs/ at /docs/. The page reads
# the release and the milestones from GitHub as it opens, so it needs publishing again only when
# it or the documentation changes.
name: Pages

on:
  push:
    branches: [main]
    paths: [website/**, docs/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # The Predator's wire frame from the docs, drawn in the page's orange.
      - run: sed 's/#7d8590/#f08a2c/g' docs/images/predator-wireframe.svg > website/predator.svg
      # The documentation, rendered by MkDocs in the website's style into website/docs.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install "mkdocs>=1.6,<2" pymdown-extensions
      # The game's menu font, which the headings use, in a form browsers accept.
      - run: pip install fonttools
      - run: mkdir -p website/fonts && python3 .github/scripts/web_font.py deps/newtown/Newtown.ttf website/fonts/Newtown.ttf
      - run: mkdocs build --strict --config-file website/mkdocs.yml
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deploy
        uses: actions/deploy-pages@v4

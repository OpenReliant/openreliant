# Builds the executables and runs the tests on Linux, macOS and Windows for every pull request and
# every push to main, and checks the Zig code's formatting.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

env:
  # Deletes the cache manifests that name our own sources. They hold them as relative paths
  # (src/...), where the packages' sources are absolute.
  forget_our_code: >-
    { grep -a -l -r -E '(^|[^/\\[:alnum:]_.+-])src[/\\]' .zig-cache/h 2>/dev/null || true; }
    | xargs rm -f

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      # The formatting is the same on every system, so it's checked once.
      - if: runner.os == 'Linux'
        run: zig fmt --check src build.zig
      # A cache saved before this step existed can name binaries it no longer holds.
      - name: Forget the cached builds of our own code
        shell: bash
        run: ${{ env.forget_our_code }}
      - run: zig build --summary all
      # On Windows, the executables carry a manifest, which Windows reads as they start, and version
      # information, which has to give the version they report.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($program in 'openreliant', 'sltool') {
            $reported = & "zig-out/bin/$program.exe" --version
            $carried = (Get-Item "zig-out/bin/$program.exe").VersionInfo.ProductVersion
            if ($LASTEXITCODE -ne 0 -or $reported -ne "$program $carried") {
              throw "$program.exe reports '$reported' but carries '$carried'"
            }
          }
      - run: zig build test --summary all
      # Releases are built ReleaseFast, without the safety checks, so the tests run in that mode
      # too: Debug catches an overflow or a bad index with its checks on, and ReleaseFast what only
      # goes wrong in the build players run, such as a read of undefined memory.
      - run: zig build test --release=fast --summary all
      # setup-zig saves .zig-cache after the job, but clears it when it is over 2 GB. Our own
      # programs and test binaries change with every commit and would fill it, so they are left
      # out: the C libraries, the fetched packages and translate-c then stay cached between runs.
      # Zig takes a build as cached from its manifest alone, so the manifests that name our sources
      # go too, or the next run would look for binaries that are gone.
      - if: always()
        shell: bash
        run: >-
          find .zig-cache/o -type f \(
          -name test -o -name 'test.*' -o -name '*_zcu.o' -o -name '*_zcu.obj'
          -o -name 'openreliant' -o -name 'openreliant.*' -o -name 'sltool' -o -name 'sltool.*'
          -o -name 'tablegen*' -o -name 'ghidragen*' -o -name 'build-mission' -o -name 'build-mission.*'
          -o -name 'build-resources' -o -name 'build-resources.*'
          \) -delete && ${{ env.forget_our_code }}

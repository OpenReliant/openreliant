# Fails a pull request that holds a file from the game, or one that looks like it. `main` takes
# changes through squash-merged pull requests alone, so what a pull request holds is what it brings.
name: No game files

on:
  pull_request:

jobs:
  check-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-files.sh

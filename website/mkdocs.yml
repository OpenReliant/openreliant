# The documentation under docs/, rendered for the website at /docs/ in the website's own style
# (docs-theme). The Pages workflow builds it with MkDocs. Links that leave docs/, such as to the
# sources, go to the files on GitHub (docs_hooks.py).
site_name: OpenReliant docs
site_url: https://openreliant.github.io/openreliant/docs/
site_description: How to install, play and mod OpenReliant, how its engine works, and StarLancer's file formats.
repo_url: https://github.com/OpenReliant/openreliant
edit_uri: edit/main/docs/
docs_dir: ../docs
site_dir: docs
use_directory_urls: true
hooks:
  - docs_hooks.py
plugins: []
theme:
  name: null
  custom_dir: docs-theme
markdown_extensions:
  - tables
  - pymdownx.superfences
  - attr_list
  - toc:
      permalink: true

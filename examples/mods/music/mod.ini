[Mod]
Name=Example: Music
Version=1.0
Author=OpenReliant
Description=An example for mod makers, not a supported mod. OpenReliant Theme, a track by Zabk composed for it (CC BY-SA 4.0), in place of the main menu's music. It loops back where the game's piece does: three bars of intro, then a body of 48 bars that repeats from 5.95 seconds in.
OpenReliant=0.7

; New_Pensive.wav replaces the game's music\New_Pensive.wav by its name, as any music file in a
; mod does. The game's piece doesn't loop back to its start but to a point partway through, which
; OpenReliant's loop table gives as a byte offset into the game's file. A mod's piece loops back
; to the same moment of the music, whatever its format. This one is IMA ADPCM mono at 22,050 Hz
; where the game's is stereo, so the moment lands on another byte, which OpenReliant works out.
;
; The track is at 121 beats a minute, and its body begins exactly where OpenReliant loops back
; to, 5.95 seconds in: three bars of intro, then the body, which plays to the end of the file and
; repeats from there. The track is Zabk's OpenReliant Theme, licensed CC BY-SA 4.0
; (https://creativecommons.org/licenses/by-sa/4.0/).

[Mod]
Name=Example: Teapot
Version=1.0
Author=OpenReliant
Description=An example for mod makers, not a supported mod. A yellow Utah teapot (Martin Newell's teapot, tessellated from the patch data in three.js's TeapotGeometry, MIT licence) as a new fighter based on the Predator, flown in a game mode, TEAPOT ARENA. Its model is built from teapot.obj with sltool shp from-obj, its lid the cockpit that flies off as the pilot ejects.
OpenReliant=0.7

[ShipTypes]
teapot=

[ShipType teapot]
Base=predator
Model=teapot.shp
Schematic=teapotscem.spr
Name=Teapot
; Flown by the player: the Tempest's cockpit, the teapot on the gunnery display (teapotwire_000.png)
; and in the wing's window (teapoticon_000.png), and a kettle's hum for an engine.
Cockpit=temg_frm.shp
WireFrame=teapotwire
WingIcon=teapoticon
EngineSound=kettle.wav

[Scripts]
Menu=menu.luau
Global=quiet.luau

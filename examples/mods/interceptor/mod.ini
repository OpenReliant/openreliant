[Mod]
Name=Example: Interceptor
Version=1.0
Author=OpenReliant
Description=A scripting example for mod makers, not a supported mod. A new ship type, the Interceptor: a faster, lightly shielded Predator under a name of its own, flown in a game mode, INTERCEPTOR ARENA, on the main menu's GAME MODES.
OpenReliant=0.7

; The ship types the mod adds. The number after each name is the one the mod's own missions use
; for it; this mod has no missions, so it leaves it empty.
[ShipTypes]
interceptor=

; The Interceptor acts as the Predator wherever the game singles out a ship, starts from the
; Predator's records, and here keeps the Predator's model and schematic under a name of its own.
[ShipType interceptor]
Base=predator
Model=uslf_prd.shp
Name=Interceptor

[Scripts]
Load=records.luau
Menu=menu.luau

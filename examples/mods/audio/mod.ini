[Mod]
Name=Example: Audio
Version=1.0
Author=OpenReliant
Description=A scripting example for mod makers, not a supported mod. When a piece of music starts, it plays a chime and shows the piece's name over the menus and the rooms. In flight, Shift F4 drops a beacon that pings where the ship was, Shift F3 plays a ping at the target, and Shift F2 fades out the music, or starts the main menu's piece if no music plays.
OpenReliant=0.14

; chime.wav and beacon.wav are made from sine tones for this example. Scripts play a sound file
; from their own mod by name, in WAV, FLAC, MP3, Ogg Vorbis or Opus.

[Scripts]
Menu=now_playing.luau
Player=beacon.luau

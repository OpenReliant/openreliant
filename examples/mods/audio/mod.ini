[Mod]
Name=Example: Audio
Version=1.0
Author=OpenReliant
Description=A scripting example for mod makers, not a supported mod. A chime of its own plays as each piece of music starts, and the piece's name shows over the menus and the rooms. In flight, Shift F4 drops a beacon that pings from where the ship was, Shift F3 has the target ping, and Shift F2 fades the music out, or brings the main menu's piece in where none plays.
OpenReliant=0.14

; chime.wav and beacon.wav are the mod's own sounds, made from sine tones for this example. A
; script plays a file of its own mod by its name, in WAV, FLAC, MP3, Ogg Vorbis or Opus.

[Scripts]
Menu=now_playing.luau
Player=beacon.luau

[Mod]
Name=Example: CD Player Pages
Version=1.0
Author=OpenReliant
Description=A scripting example for mod makers, not a supported mod. Gives the CD player in the rooms its pages on both carriers: the Reliant's twelve tracks, the Yamato's, and any that mods add. The front end's arrows on the plate under the player's screen turn the page, and so do Page Up and Page Down.
OpenReliant=0.14


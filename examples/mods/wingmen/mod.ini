[Mod]
Name=Wingmen
Version=1.0
Author=OpenReliant
Description=A badly damaged wingman pulls out of the fight once and runs from its attacker, then rejoins the player's formation a little later. A panel over the flight display shows the wingmen nearby: F9 shows and hides it, and Shift+F9, or regroup typed in the scripting console, calls the wingmen that pulled out back at once. Other mods can count the wingmen that pulled out through the Wingmen interface.

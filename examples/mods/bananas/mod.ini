[Mod]
Name=Example: Bananas
Version=1.0
Author=OpenReliant
Description=A scripting example for mod makers, not a supported mod. A new gun, missile, pilot and ship: the Banana Boat, a Predator that fires the Banana Gun and carries Banana missiles, flown in BANANA ARENA on the main menu's GAME MODES, where every enemy fighter is flown by a Trooper, who never hits anything.
OpenReliant=0.7

; Each section lists what the mod adds of one kind. The number after a name is the one the mod's own
; missions or models use for it; this mod has neither, so it leaves them empty.
[Guns]
banana_gun=

[Gun banana_gun]
Base=pulse_cannon
Name=Banana Gun
; Each shot is a banana, banana_shot.png, 40 across either way of its middle, and goes boing.
Shot=banana_shot.png
ShotSize=40
Sound=boing.wav

[Missiles]
banana=

; Based on the Bandit, a homing missile that hangs on its own rail, so each Banana hangs on a
; hardpoint of its own and launches from there.
[Missile banana]
Base=bandit
Name=Banana
; The banana, built from banana.obj: sltool shp from-obj banana.obj banana.shp
Model=banana.shp
Description=A homing banana. It locks on slowly, but nothing outruns it.
; Offered on the loadout's missile page from the campaign's first tier.
Tier=0

; Pilot 21 is one of the Coalition's, whose face the Trooper has. The game gives pilot 21 no voice,
; so the Trooper speaks in the Coalition's, rus.
[Pilots]
trooper=

[Pilot trooper]
Base=21
Name=Trooper
Voice=rus

; The Banana Boat keeps the Predator's model, and fires the Banana Gun from every gun and the Banana
; missile from every hardpoint, whatever the model names.
[ShipTypes]
banana_boat=

[ShipType banana_boat]
Base=predator
Model=uslf_prd.shp
Name=Banana Boat
Guns=banana_gun
Missiles=banana

[Scripts]
Load=records.luau
Menu=menu.luau
Global=troopers.luau

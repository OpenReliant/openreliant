[Mod]
Name=Example: Bananas
Version=1.0
Author=OpenReliant
Description=A scripting example for mod makers, not a supported mod. A new gun, missile, pilot and ship: the Banana Boat, a Predator that fires the Banana Gun and carries Banana missiles, flown in BANANA ARENA on the main menu's GAME MODES, where every enemy fighter is flown by a Trooper, who never hits anything.
OpenReliant=0.7

; Each section lists what the mod adds of one kind. The number after a name is the one the mod's own
; missions or models use for it; this mod has neither, so it leaves them empty.
[Guns]
banana_gun=

[Gun banana_gun]
Base=pulse_cannon
Name=Banana Gun

[Missiles]
banana=

[Missile banana]
Base=raptor
Name=Banana

; Pilot 21 is one of the Coalition's, whose face and voice the Trooper has.
[Pilots]
trooper=

[Pilot trooper]
Base=21
Name=Trooper

; The Banana Boat keeps the Predator's model, and fires the Banana Gun from every gun and the Banana
; missile from every hardpoint, whatever the model names.
[ShipTypes]
banana_boat=

[ShipType banana_boat]
Base=predator
Model=uslf_prd.shp
Name=Banana Boat
Guns=banana_gun
Missiles=banana

[Scripts]
Load=records.luau
Menu=menu.luau
Global=troopers.luau

[Mod]
Name=Example: Trent
Version=1.0
Author=OpenReliant
Description=An example for mod makers, not a supported mod. Moose becomes Trent: Trent's face on the radio, and his name wherever the game shows Moose's.
OpenReliant=0.7

; The face films replace Moose's in pilots.hog, by their names. The game plays the 45th's films
; under the squadron's name: the 45th Volunteers' through mission 13, and the 45th Tigers' from
; mission 14. So each film comes twice. Trent laughs with his talking film.
;
; Each film is built from the strip of frames beside it, 120 by 100 pixels each, played at 15
; frames a second: trent_talking.png makes the talking and laughing films, and trent_dying.png the
; dying ones. For example:
;   mkdir frames
;   magick trent_talking.png -crop 120x100 +repage frames/%03d.png
;   sltool fm8 encode frames 45Tigers_Moose.fm8

[Scripts]
; Renames Moose in the game's text.
Load=name.luau
